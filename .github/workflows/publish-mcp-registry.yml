name: Publish PyPI + MCP Registry

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    # DO NOT PUBLISH FROM A FORK.
    #
    # This workflow publishes two things under the UPSTREAM project's identity:
    # PyPI `workspace-mcp` (via Trusted Publishing, hence id-token: write) and
    # the MCP Registry name `io.github.taylorwilsdon/workspace-mcp` in
    # server.json. A fork inherits the workflow but not the right to those
    # names, so a `v*` tag pushed on a fork attempts a release it must not make.
    #
    # Two independent signals, and the job runs only if BOTH agree this is
    # upstream. Fail-closed by construction: the repository-name check is an
    # exact string comparison, so any repo that is not upstream — a fork, a
    # rename, a transfer — skips the job even if the `fork` flag is missing or
    # unexpected for some trigger. The `fork` check is the second layer and can
    # only ever withhold the publish, never grant it.
    #
    # Note `github.event.repository.fork` is the RIGHT flag here and asks a
    # different question than it does in check-maintainer-edits.yml, where
    # testing it was a bug. There it was asked to mean "did this PR come from a
    # contributor's fork" — which it does not, since this repo is itself a fork.
    # Here the question genuinely is "is the repo running this workflow a fork",
    # which is exactly what the flag reports.
    if: >-
      github.repository == 'taylorwilsdon/google_workspace_mcp'
      && github.event.repository.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"

      - name: Resolve version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Verify tag matches pyproject version
        run: |
          PYPROJECT_VERSION="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
          print(data["project"]["version"])
          PY
          )"
          if [ "$PYPROJECT_VERSION" != "$VERSION" ]; then
            echo "Tag version ($VERSION) does not match pyproject version ($PYPROJECT_VERSION)."
            exit 1
          fi

      - name: Sync server.json version with release
        run: |
          tmp="$(mktemp)"
          jq --arg version "$VERSION" '
            .version = $version
            | .packages = (
                (.packages // [])
                | map(
                    if ((.registryType // .registry_type // "") == "pypi")
                    then .version = $version
                    else .
                    end
                  )
              )
          ' server.json > "$tmp"
          mv "$tmp" server.json

      - name: Validate server.json against schema
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema requests
          python - <<'PY'
          import json
          import requests
          from jsonschema import Draft202012Validator

          with open("server.json", "r", encoding="utf-8") as f:
              instance = json.load(f)

          schema_url = instance["$schema"]
          schema = requests.get(schema_url, timeout=30).json()

          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(instance)
          print("server.json schema validation passed")
          PY

      - name: Build distribution
        run: |
          python -m pip install build
          python -m build

      - name: Check package metadata
        run: |
          python -m pip install twine
          twine check dist/*

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1 (BRANCH)
        with:
          skip-existing: true

      - name: Install mcp-publisher
        run: |
          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ARCH="$(uname -m | sed 's/x86_64/amd64/' | sed 's/aarch64/arm64/')"
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${OS}_${ARCH}.tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Login to MCP Registry with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
